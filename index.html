  const $ = (id) => document.getElementById(id);
  const msg = $('msg'), go = $('go'), pw = $('pw');

  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    msg.textContent = 'This browser cannot open the page. Use an up-to-date browser, over https.';
    go.disabled = true;
    return;
  }

  const bytes = Uint8Array.from(atob($('payload').textContent.replace(/\s+/g, '')), (c) => c.charCodeAt(0));
  const salt = bytes.subarray(0, 16), iv = bytes.subarray(16, 28), sealed = bytes.subarray(28);
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  const saltId = b64(salt);

  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' }, base, 256));
  }

  /** Throws when the key is wrong — AES-GCM checks its own tag. */
  async function unseal(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, sealed);
    const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  const remembered = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      return saved && saved.salt === saltId ? Uint8Array.from(atob(saved.key), (c) => c.charCodeAt(0)) : null;
    } catch { return null; }
  })();

  if (remembered) {
    go.disabled = true;
    unseal(remembered).then(show, () => {
      try { localStorage.removeItem(STORE); } catch {}
      go.disabled = false;
    });
  }

  $('gate').addEventListener('submit', async (event) => {
    event.preventDefault();
    go.disabled = true;
    go.textContent = 'Opening…';
    msg.textContent = '';
    try {
      const raw = await derive(pw.value);
      const html = await unseal(raw);
      if ($('remember').checked) {
        try { localStorage.setItem(STORE, JSON.stringify({ salt: saltId, key: b64(raw) })); } catch {}
      }
      show(html);
    } catch {
      msg.textContent = 'Wrong password.';
      go.disabled = false;
      go.textContent = 'Open';
      pw.select();
    }
  });
})();
</script>
</body>
</html>
